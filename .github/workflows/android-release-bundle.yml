name: Android Release Bundles

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  release-bundles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build NEXORA AAB
        run: gradle :app:bundleNexoraRelease --stacktrace

      - name: Build SAKAN AAB
        run: gradle :app:bundleSakanRelease --stacktrace

      - name: Build HELP-ME AAB
        run: gradle :app:bundleHelpmeRelease --stacktrace

      - name: Upload NEXORA AAB
        uses: actions/upload-artifact@v4
        with:
          name: digitalfuture-nexora-release-aab-unsigned
          path: app/build/outputs/bundle/nexoraRelease/app-nexora-release.aab
          if-no-files-found: error

      - name: Upload SAKAN AAB
        uses: actions/upload-artifact@v4
        with:
          name: digitalfuture-sakan-release-aab-unsigned
          path: app/build/outputs/bundle/sakanRelease/app-sakan-release.aab
          if-no-files-found: error

      - name: Upload HELP-ME AAB
        uses: actions/upload-artifact@v4
        with:
          name: digitalfuture-helpme-release-aab-unsigned
          path: app/build/outputs/bundle/helpmeRelease/app-helpme-release.aab
          if-no-files-found: error
