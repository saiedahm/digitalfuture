name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build NEXORA debug APK
        run: gradle :app:assembleNexoraDebug --stacktrace

      - name: Build SAKAN debug APK
        run: gradle :app:assembleSakanDebug --stacktrace

      - name: Build HELP-ME debug APK
        run: gradle :app:assembleHelpmeDebug --stacktrace

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: digitalfuture-debug-apks
          path: |
            app/build/outputs/apk/nexora/debug/app-nexora-debug.apk
            app/build/outputs/apk/sakan/debug/app-sakan-debug.apk
            app/build/outputs/apk/helpme/debug/app-helpme-debug.apk
          if-no-files-found: error
